<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Connect</title>
    <script src="https://cdn.jsdelivr.net/npm/libsodium@0.7.15/dist/modules/libsodium.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.15/dist/modules/libsodium-wrappers.js"></script>
  </head>
  <body>
    <script>
      const BACKEND_URL =
        "https://gratitude-backend-121647732945.europe-west4.run.app";
      const STORAGE_KEY = "communityShareKeys";
      const SHARED_KEY = "communityContactShared";
      const MATCH_CACHE_KEY = "communityMatches"; // populated by community-inbox
      const SKILL_TAG = "community-connect";

      function loadMatchCache() {
        try {
          const raw = localStorage.getItem(MATCH_CACHE_KEY);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (e) {
          return {};
        }
      }

      function loadStoredKeys() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      function recordShared(yourMessageId, theirPublicKey) {
        try {
          const raw = localStorage.getItem(SHARED_KEY);
          const map = raw ? JSON.parse(raw) : {};
          const list = Array.isArray(map[yourMessageId])
            ? map[yourMessageId]
            : [];
          if (!list.includes(theirPublicKey)) list.push(theirPublicKey);
          map[yourMessageId] = list;
          localStorage.setItem(SHARED_KEY, JSON.stringify(map));
        } catch (e) {
          console.warn(`[${SKILL_TAG}] sharedMap write failed:`, e);
        }
      }

      // Tolerant JSON parse: Gemma sometimes appends a stray trailing
      // quote (e.g. `{"k":"v"}"`) to the tool-call `data` argument.
      function parseToolData(d) {
        if (!d) return {};
        const s = String(d).trim();
        if (!s) return {};
        const start = s.indexOf("{");
        if (start < 0) return JSON.parse(s);
        let depth = 0, inStr = false, esc = false;
        for (let i = start; i < s.length; i++) {
          const c = s[i];
          if (esc) { esc = false; continue; }
          if (inStr) {
            if (c === "\\") esc = true;
            else if (c === '"') inStr = false;
            continue;
          }
          if (c === '"') inStr = true;
          else if (c === "{") depth++;
          else if (c === "}") {
            depth--;
            if (depth === 0) return JSON.parse(s.slice(start, i + 1));
          }
        }
        return JSON.parse(s.slice(start));
      }

      // Case- and separator-insensitive field lookup. Gemma E2B routinely
      // renames fields (`contactText` -> `contact`, `contact_Text`, `Contact-Text`),
      // so we normalize keys before comparing aliases.
      function getField(obj, ...aliases) {
        if (!obj || typeof obj !== "object") return undefined;
        const norm = (s) => String(s).toLowerCase().replace(/[_\s\-]/g, "");
        const targets = new Set(aliases.map(norm));
        for (const k of Object.keys(obj)) {
          if (targets.has(norm(k))) return obj[k];
        }
        return undefined;
      }

      window.ai_edge_gallery_get_result = async (data) => {
        try {
          await sodium.ready;
          const args = parseToolData(data);
          // Accept any reasonable Gemma rephrasing. Normalizer strips case,
          // underscores, spaces, and dashes — so "Contact", "contact_Text",
          // "contact-info", "Contact Details" all collapse to one of these.
          const contactText = getField(
            args,
            "contactText",
            "contact",
            "contactInfo",
            "contactDetails",
            "contactString",
            "contactData",
            "contactMessage",
            "contactNote",
            "message",
            "details",
            "info",
            "text",
            "plaintext",
            "payload"
          );
          // Prefer the opaque matchToken (e.g. "M1") populated by community-inbox.
          // Only the token has to travel through the model — the real keys live
          // in localStorage on this device and never enter the LLM context.
          const matchToken = getField(args, "matchToken", "match", "token");
          const matchCache = loadMatchCache();
          const cached = matchToken ? matchCache[matchToken] : null;

          // Resolve recipientPublicKey / yourMessageId, preferring the cache
          // (which the model can't mangle) and falling back to anything the
          // model passed in.
          const recipientPublicKey =
            cached?.theirPublicKey ||
            args.recipientPublicKey ||
            args.theirPublicKey;
          const yourMessageId =
            cached?.yourMessageId ||
            args.yourMessageId ||
            args.myMessageId;

          if (!contactText || typeof contactText !== "string") {
            return JSON.stringify({ error: "contactText is required" });
          }
          if (!recipientPublicKey || typeof recipientPublicKey !== "string") {
            return JSON.stringify({
              error: matchToken
                ? `Unknown matchToken "${matchToken}". Run community-inbox first to refresh.`
                : "matchToken (from community-inbox) is required",
            });
          }
          if (!yourMessageId || typeof yourMessageId !== "string") {
            return JSON.stringify({
              error: "Couldn't resolve which of your posts this match is for.",
            });
          }

          // Prefer keys cached on the match itself (kept consistent at inbox-time);
          // fall back to the per-post entry in communityShareKeys.
          const stored = loadStoredKeys();
          const fallbackEntry = stored.find(
            (e) => e && e.messageId === yourMessageId
          );
          const ownerPublicKey =
            cached?.ownerPublicKey || fallbackEntry?.publicKey || null;
          const ownerPrivateKey =
            cached?.ownerPrivateKey || fallbackEntry?.privateKey || null;
          if (!ownerPublicKey || !ownerPrivateKey) {
            return JSON.stringify({
              error:
                "Couldn't find the signing key for your matched post on this device.",
            });
          }
          const myEntry = {
            publicKey: ownerPublicKey,
            privateKey: ownerPrivateKey,
          };

          // Sealed-box: convert recipient Ed25519 pub -> X25519, encrypt.
          const recipientEdPub = sodium.from_base64(
            recipientPublicKey,
            sodium.base64_variants.ORIGINAL
          );
          const recipientXPub =
            sodium.crypto_sign_ed25519_pk_to_curve25519(recipientEdPub);
          const ctBytes = sodium.crypto_box_seal(
            new TextEncoder().encode(contactText),
            recipientXPub
          );
          const encryptedPayload = sodium.to_base64(
            ctBytes,
            sodium.base64_variants.ORIGINAL
          );

          // Sign the ciphertext with the sender's Ed25519 private key.
          const senderEdPriv = sodium.from_base64(
            myEntry.privateKey,
            sodium.base64_variants.ORIGINAL
          );
          const sig = sodium.crypto_sign_detached(ctBytes, senderEdPriv);
          const signature = sodium.to_base64(
            sig,
            sodium.base64_variants.ORIGINAL
          );

          const res = await fetch(`${BACKEND_URL}/v1/contact/share`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              senderPublicKey: myEntry.publicKey,
              recipientPublicKey,
              encryptedPayload,
              signature,
            }),
          });

          if (!res.ok) {
            const text = await res.text().catch(() => "");
            return JSON.stringify({
              error: `Backend ${res.status}: ${text || res.statusText}`,
            });
          }

          const json = await res.json();
          recordShared(yourMessageId, recipientPublicKey);

          return JSON.stringify({
            ok: true,
            contactRecordId: json.contactRecordId || null,
          });
        } catch (e) {
          console.error(`[${SKILL_TAG}]`, e);
          return JSON.stringify({
            error: `Share failed: ${e && e.message ? e.message : String(e)}`,
          });
        }
      };
    </script>
  </body>
</html>
