name: Android Preview Build

on:
  push:
    branches:
      - main
      - local-transfer
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo
        run: npm install -g expo-cli eas-cli

      - name: Generate Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gratitude-android-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload APK artifact (latest)
        uses: actions/upload-artifact@v4
        with:
          name: gratitude-android-latest
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Comment APK download link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 📱 Android Preview Build Ready!

            Download the APK artifact from the workflow run:
            - [Download APK (gratitude-android-${{ github.sha }})](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **SHA:** \`${{ github.sha }}\`
            **Build:** #${{ github.run_number }}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
